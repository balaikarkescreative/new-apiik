<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!-- Background rectangle -->
    <rect width="100%" height="100%" rx="10" ry="10" fill="#111827" />
    
    <!-- Play button circle -->
    <circle cx="100" cy="75" r="30" fill="rgba(255,255,255,0.2)" />
    
    <!-- Play icon -->
    <polygon points="92,60 92,90 115,75" fill="white" />
    
    <!-- Video reel decorations -->
    <rect x="10" y="15" width="15" height="120" fill="rgba(255,255,255,0.05)" rx="2" ry="2" />
    <rect x="175" y="15" width="15" height="120" fill="rgba(255,255,255,0.05)" rx="2" ry="2" />
    
    <!-- Holes in reel -->
    <circle cx="17.5" cy="25" r="3" fill="#111827" />
    <circle cx="17.5" cy="45" r="3" fill="#111827" />
    <circle cx="17.5" cy="65" r="3" fill="#111827" />
    <circle cx="17.5" cy="85" r="3" fill="#111827" />
    <circle cx="17.5" cy="105" r="3" fill="#111827" />
    <circle cx="17.5" cy="125" r="3" fill="#111827" />
    
    <circle cx="182.5" cy="25" r="3" fill="#111827" />
    <circle cx="182.5" cy="45" r="3" fill="#111827" />
    <circle cx="182.5" cy="65" r="3" fill="#111827" />
    <circle cx="182.5" cy="85" r="3" fill="#111827" />
    <circle cx="182.5" cy="105" r="3" fill="#111827" />
    <circle cx="182.5" cy="125" r="3" fill="#111827" />
</svg>
